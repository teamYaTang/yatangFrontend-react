<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon/apple-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FDD5D4" />
    <meta name="description" content="집밥부자 — 냉장고·재료 관리와 AI 레시피" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>집밥부자</title>
    <!-- cache-bust: 2026-09-08-v2 -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: env(safe-area-inset-top, 0) 24px env(safe-area-inset-bottom, 0);
        background: linear-gradient(165deg, #ffe8e7 0%, #fdd5d4 42%, #f6f8fb 100%);
        box-sizing: border-box;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash img {
        width: min(168px, 42vw);
        height: auto;
        border-radius: 28px;
        box-shadow: 0 12px 36px rgba(190, 90, 90, 0.22);
        -webkit-user-drag: none;
      }
      #boot-splash .boot-brand {
        margin: 0;
        font-family: "Noto Sans KR", -apple-system, sans-serif;
        font-weight: 700;
        font-size: 1.45rem;
        letter-spacing: -0.02em;
        color: #7c2d2d;
      }
      #boot-splash .boot-sub {
        margin: 0;
        font-family: "Noto Sans KR", -apple-system, sans-serif;
        font-weight: 400;
        font-size: 0.92rem;
        color: #9a5b5b;
      }
      #boot-splash .boot-dots {
        display: flex;
        gap: 8px;
        margin-top: 6px;
      }
      #boot-splash .boot-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #e07a7a;
        animation: bootPulse 1.05s ease-in-out infinite;
      }
      #boot-splash .boot-dots span:nth-child(2) { animation-delay: 0.15s; }
      #boot-splash .boot-dots span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes bootPulse {
        0%, 80%, 100% { opacity: 0.35; transform: scale(0.85); }
        40% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <noscript>JavaScript를 켜야 집밥부자를 이용할 수 있습니다.</noscript>
    <div id="boot-splash" aria-busy="true" aria-live="polite">
      <img src="%PUBLIC_URL%/boot-logo.png" alt="" width="168" height="168" />
      <p class="boot-brand">집밥부자</p>
      <p class="boot-sub">냉장고를 여는 중…</p>
      <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
  </body>
</html>
